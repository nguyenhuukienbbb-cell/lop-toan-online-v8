{% extends 'base.html' %}{% block heading %}Bài giảng{% endblock %}{% block content %}<div class="grid2"><div class="card"><h3>Tạo bài giảng</h3><form method="post"><label>Tiêu đề</label><input name="title" required><label>Lớp</label><select name="classroom_id">{% for c in classes %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><label>Mô tả</label><textarea name="description"></textarea><label>Nội dung bài giảng</label><textarea name="content" rows="9" placeholder="Nhập lý thuyết, ví dụ, hướng dẫn..."></textarea><label>Liên kết tài liệu/video</label><input name="resource_url" placeholder="https://..."><label><input type="checkbox" name="is_published"> Xuất bản cho học sinh</label><br><br><button>Tạo bài giảng</button></form></div><div class="card"><h3>Bài giảng đã tạo</h3>{% for x in lessons %}<div class="q"><b>{{x.title}}</b> <span class="badge">{{'Đã giao' if x.is_published else 'Bản nháp'}}</span><p class="muted">{{x.description}}</p><form method="post" action="/teacher/lesson/{{x.id}}/delete" onsubmit="return confirm('Xóa bài giảng?')"><button class="red">Xóa</button></form></div>{% else %}<p>Chưa có bài giảng.</p>{% endfor %}</div></div>{% endblock %}
