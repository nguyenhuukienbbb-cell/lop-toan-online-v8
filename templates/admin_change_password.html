{% extends 'base.html' %}
{% block heading %}Đổi mật khẩu Admin{% endblock %}
{% block content %}
<div class="card" style="max-width:620px">
  <h3>🔐 Đổi mật khẩu quản trị</h3>
  <p class="muted">Mật khẩu mới nên dài ít nhất 8 ký tự và không dùng lại mật khẩu cũ.</p>

  <form method="post" onsubmit="return validateAdminPasswordForm()">
    <label>Mật khẩu hiện tại</label>
    <input type="password" name="current_password" id="current_password" required autocomplete="current-password">

    <label>Mật khẩu mới</label>
    <input type="password" name="new_password" id="new_password" required minlength="8" autocomplete="new-password">

    <label>Xác nhận mật khẩu mới</label>
    <input type="password" name="confirm_password" id="confirm_password" required minlength="8" autocomplete="new-password">

    <p><label><input type="checkbox" onclick="toggleAdminPasswords(this)"> Hiện mật khẩu</label></p>

    <button class="green">Đổi mật khẩu</button>
  </form>
</div>

<script>
function toggleAdminPasswords(box) {
  ['current_password','new_password','confirm_password'].forEach(function(id){
    document.getElementById(id).type = box.checked ? 'text' : 'password';
  });
}
function validateAdminPasswordForm() {
  const p1 = document.getElementById('new_password').value;
  const p2 = document.getElementById('confirm_password').value;
  if (p1.length < 8) {
    alert('Mật khẩu mới phải có ít nhất 8 ký tự.');
    return false;
  }
  if (p1 !== p2) {
    alert('Xác nhận mật khẩu mới không khớp.');
    return false;
  }
  return true;
}
</script>
{% endblock %}
