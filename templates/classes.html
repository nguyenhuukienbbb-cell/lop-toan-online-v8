{% extends 'base.html' %}{% block heading %}Lớp học{% endblock %}{% block content %}<div class="grid2"><div class="card"><h3>Tạo lớp</h3><form method="post"><label>Tên lớp</label><input name="name" placeholder="6A1" required><label>Khối</label><input name="grade" placeholder="6"><label>Mô tả</label><textarea name="description"></textarea><button>Tạo lớp</button></form></div><div class="card"><h3>Danh sách lớp</h3><table><tr><th>Lớp</th><th>Khối</th><th>Học sinh</th><th>Bài tập</th></tr>{% for c,students,assignments in rows %}<tr><td><b>{{c.name}}</b></td><td>{{c.grade}}</td><td>{{students}}</td><td>{{assignments}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
