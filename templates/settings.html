{% extends 'base.html' %}{% block heading %}Cài đặt hệ thống{% endblock %}{% block content %}<div class="card" style="max-width:760px"><h2>Thông tin lớp học</h2><form method="post" enctype="multipart/form-data"><label>Tên hệ thống</label><input name="site_title" value="{{setting.site_title}}"><label>Tên giáo viên hiển thị</label><input name="teacher_label" value="{{setting.teacher_label}}"><label>Email Google của giáo viên</label><input type="email" name="email" value="{{me.email or ''}}"><label>Lời chào</label><textarea name="welcome_text">{{setting.welcome_text}}</textarea><label>Ảnh đại diện</label><input type="file" name="avatar" accept=".png,.jpg,.jpeg,.webp"><button>Lưu cài đặt</button></form><hr><h3>Đăng nhập Google</h3><p class="muted">Trạng thái: <b>{{'Đã cấu hình' if google_enabled else 'Chưa cấu hình'}}</b>. Xem file <b>HUONG_DAN_GOOGLE.txt</b> trong thư mục chương trình.</p></div>{% endblock %}
